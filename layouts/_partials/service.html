<section id="service" class="section">
  <h2>Service</h2>
  <div class="service-list">
    {{ range .Site.Data.service.entries }}
    <article class="service-entry">
      <h3 class="service-organization">{{ .organization }}</h3>
      <span class="service-role">{{ .role }}</span>
      <span class="service-time">{{ .time }}</span>
    </article>
    {{ end }}
  </div>
</section>
