<!-- service -->
<section id="service" class="background-subsection">
  <h3>Service &amp; Leadership</h3>
  <div class="service-list">
    {{ range .Site.Data.service.entries }}
    <article class="service-entry">
      <span class="service-main">
        <span class="service-venue">[{{ .organization }}]</span>
        <span class="role">{{ .role }}</span>
      </span>
      <span class="time">{{ .time }}</span>
    </article>
    {{ end }}
  </div>
</section>
