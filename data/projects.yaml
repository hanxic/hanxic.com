entries:
  - title: RISC-V Pipelined Processor
    technologies:
      - SystemVerilog
      - Python
      - FPGA
    period: Feb 2025 -- May 2025
    institution: University of Pennsylvania
    course: CIS 5710 Computer Organization and Design
    supervisor: Prof. Joe Devietti
    bullets:
      - Implemented a RISC-V pipelined processor with AXI-Lite-style caching, multi-cycle execution units, branch prediction, and memory-mapped I/O.
      - Built custom verification testbenches, optimized LUT usage and timing behavior, and synthesized the design to FPGA to run compiled programs.
  - title: Oat Compiler
    technologies:
      - OCaml
      - C
      - LLVM IR
      - x86
      - Clang
      - Dune
    period: Feb 2024 -- May 2024
    institution: University of Pennsylvania
    course: CIS 7000 Compilers and Interpreters
    supervisor: Prof. Steve Zdancewic
    bullets:
      - Implemented a compiler for Oat, a C-like language with pointers and structured data, including lexing, parsing, type checking, frontend lowering, and backend code generation to LLVM IR and x86.
      - Added static analyses and optimizations including mem2reg and dead-code elimination, validated against thousands of test cases.
  - title: SQL Interpreter
    technologies:
      - Haskell
      - MySQL
      - Cabal
    period: Sep 2023 -- Dec 2023
    institution: University of Pennsylvania
    course: CIS 5520 Advanced Programming
    supervisor: Prof. Stephanie Weirich
    bullets:
      - Led development of a Haskell library for parsing, interpreting, optimizing, and pretty-printing SQL, using GADTs, monad transformers, applicative parsers, and property-based testing.
      - Designed typed abstract syntax and execution interfaces for local query evaluation.
