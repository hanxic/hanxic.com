      - Developed Rocq infrastructure using metaprogramming for
        permutation reasoning and list AC unification, then developed
        a Rocq formalization for polymorphic,
        multiplicative-exponential linear logic with cut elimination.
      - Contributed to DeepSpec Software Foundations material
        presented at the Oregon Programming Languages Summer School
        2024.
