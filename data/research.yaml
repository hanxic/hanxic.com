  - role: Researcher
    group: PLClub
    supervisors:
      - Prof. Steve Zdancewic
    period: Jun 2021 -- Aug 2025
    institution: University of Pennsylvania
    bullets:
      - Contributed to the ICFP 2024 Vellvm memory-model paper in
        Prof. Steve Zdancewic's group, helping design a low-level
        memory model for LLVM optimization reasoning, verifying
        serialization lemmas in Rocq, and implementing tests for the
        memory model.
      - Built Rocq/OCaml validation tools for testing Vellvm's
        semantic faithfulness against LLVM implementations, including
        QuickChick generators for UB-free LLVM programs,
        interpreter-based traces, and a differential-testing framework
        that found novel LLVM bugs.
      - Developed Rocq infrastructure for permutation reasoning and
        list AC unification, then applied it to formalize first-order
        classical linear logic with cut elimination and a
        linear-resource calculus for asynchronous queries.
      - Contributed to DeepSpec Software Foundations material
        presented at the Oregon Programming Languages Summer School
        2024.
    # A bullet may be a plain string, or a {lead, note, text} map that prints the
