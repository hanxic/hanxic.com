    resume_bullets:
      - Core contributor to the Verified LLVM Project (Vellvm), which
        develops formal semantics for LLVM IR in Rocq using
        interaction trees and coinduction; co-authored its ICFP 2024
        paper, helping design a low-level memory model for
        optimization reasoning.
      - lead: Random Testing at IR Level
        note: senior thesis
        text: built a Rocq/OCaml differential-testing framework
