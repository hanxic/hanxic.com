entries:
  - role: Graduate Researcher
    group: Cornell PL Group
    supervisors:
      - Prof. Alexandra Silva
      - Prof. Andrew C. Myers
    period: Sep 2025 -- Present
    institution: Cornell University
    bullets:
      - Working toward end-to-end security for probabilistic and
        concurrent systems, from adversary models to
        semantics-preserving compilation.
      - Developed Oblivious Probabilistic Outcome Logic (opOL), a
        logic for probabilistic nondeterministic programs with
        oblivious adversaries; used schedule consumption and
        probabilistic independence to verify randomized caching and
        leader-election protocols.
      - Mechanized opOL in Lean 4, formalizing monadic semantics,
        probability-space constructions, probabilistic assertions,
        semantic and syntactic outcome triples, soundness proofs, and
        verified case studies.
      - Co-developed Type-Confusion Security, which defines security
        mechanisms that protect trusted code from ill-typed attackers,
        and recasts confused-deputy and reentrancy attacks as
        instances of this threat. Mechanized in Lean 4 as an
        extensible, executable framework.
    resume_bullets:
      - Developed Oblivious Probabilistic Outcome Logic (opOL), a
        separation logic for probabilistic nondeterministic programs
        with oblivious adversaries, supporting compositional reasoning
        about probabilistic independence, entropy leakage, and
        probabilistic liveness.
      - Mechanized opOL's metatheory in Lean 4 and developed an
        Iris-based verification framework for randomized online
        algorithms and protocols, proving competitive bounds for
        paging and liveness, validity, and agreement for leader
        election and consensus.
      - Co-developed Type-Confusion Security, which defines security
        mechanisms that protect trusted code from ill-typed attackers,
        and recasts confused-deputy and reentrancy attacks as
        instances of this threat. Mechanized in Lean 4 as an
        extensible, executable framework.
      - Exploring an intermediate representation for analyzing and
        understanding LLM reasoning with researchers at Arizona State
        University.
  - role: Research Mentor
