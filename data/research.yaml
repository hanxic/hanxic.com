entries:
  - role: Research Assistant
    group: Cornell PL Group
    supervisors:
      - Prof. Alexandra Silva
      - Prof. Andrew C. Myers
    period: Sep 2025 -- Present
    institution: Cornell University
    unit: Computer Science
    bullets:
      - Working toward end-to-end security for probabilistic and concurrent systems, from adversary models to semantics-preserving compilation.
      - Developed Oblivious Probabilistic Outcome Logic (opOL), a logic for probabilistic nondeterministic programs with oblivious adversaries; used schedule consumption and probabilistic independence to verify randomized caching and leader-election protocols.
      - Mechanized opOL in Lean 4, formalizing monadic semantics, probability-space constructions, probabilistic assertions, semantic and syntactic outcome triples, soundness proofs, and verified case studies.
      - Led the Lean mechanization of Type-Confusion Security, proving type safety for the static and dynamic information-flow checks that protect decentralized systems whose untrusted components can misrepresent dynamic types.
    resume_bullets:
      - Working toward end-to-end security guarantees -- reasoning about adversaries in probabilistic and concurrent systems, and carrying those guarantees down to executed code through semantics-preserving compilation.
      - Developed opOL, a program logic for probabilistic nondeterministic programs under oblivious adversaries, and used it to verify randomized caching and leader-election protocols; the metatheory and case studies are fully mechanized in Lean 4.
      - Led the Lean mechanization of Type-Confusion Security and proved its type safety, enforcing safety in decentralized systems whose untrusted components misrepresent dynamic types and induce confused-deputy attacks.
