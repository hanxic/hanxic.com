sections:
  - id: current
    title: Current Projects
    entries:
      - id: opol
        title: Oblivious Probabilistic Outcome Logic
        prefix: OPOL
        image: image/opol.png
        description: >
          Practical randomized protocols in distributed systems and hardware
          often rely on oblivious adversaries, but randomization + control flow can
          leak entropy through schedule consumption, making their correctness
          subtle to reason about. OPOL develops a program logic, mechanized in Lean for verifying probabilistic programs against
          oblivious adversaries.
        refs:
          - chen2026obliviousprobabilisticoutcomelogic

      - id: type-confusion-security
        title: Type-Confusion Security
        image: image/type-confusion.png
        description: >
          In decentralized systems, untrusted components can ignore the type
          system and lie about the interfaces they provide, causing type
          confusion to surface as confused-deputy and reentrancy attacks.
          This project, led by [Dr. Silei Ren](https://www.sileiren.com/), develops a formal notion of type-confusion security,
          along with static and dynamic information-flow checks to enforce it.
        refs:
          - ren2026type

      - id: autoformalization
        title: Autoformalization
        image: image/mathai.png
        description: >
          Autoformalization asks AI systems to translate mathematical
          statements and proofs into Lean code. Cornell's ongoing Math+AI project, led by [Prof. Daniel Halpern-Leistner](https://danielhl.github.io/)
          develops challenging research-level benchmarks, a survey for comparing
          Lean proofs, a collection of formalization problems, and
          LaTeX-to-Lean proof tooling.
        links:
          - label: Math+AI
            url: https://danielhl.github.io/math-ai.html

