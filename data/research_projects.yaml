      - id: precedence-constraints
        title: Knapsack Problems with Precedence Constraints
        image: image/precedence.png
        description: >
          Real-world knapsack problems, including cryptocurrency mining and
          inventory planning, often involve dependencies. However,
          precedence-constrained knapsack is strongly NP-hard in general. This
          project studies special graph classes where exact pseudo-polynomial
          algorithms are possible.
        refs:
          - chen2024wharton
