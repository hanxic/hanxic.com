      - id: vellvm-differential-testing
        title: Differential Testing for LLVM
        prefix: Vellvm
        image: image/VellvmSlide-new.svg
        keywords: [Rocq, LLVM IR, Differential testing]
        description: >
          LLVM IR is a widely used compiler intermediate
          representation whose official semantics are informal.
          [Vellvm](https://vellvm.github.io/vellvm/) formalizes a
          practical subset of LLVM IR in Rocq, including a memory
          model for optimization reasoning and differential testing to
          validate the semantics and find LLVM bugs. Joint work with
          [Calvin Beck](https://github.com/Chobbes) and [Prof. Steve
          Zdancewic](https://www.cis.upenn.edu/~stevez/).
        refs:
