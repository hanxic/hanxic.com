    entries:
      - id: opol
        title: Oblivious Probabilistic Outcome Logic
        prefix: opOL
        image: image/opol.png
        keywords: [Lean 4, Program logic, Probabilistic programming]
        description: >
          Practical randomized protocols in distributed systems and
          hardware often rely on oblivious adversaries, but
          randomization + control flow can leak entropy through
          schedule consumption, making their correctness subtle to
          reason about. opOL develops a program logic, mechanized in
          Lean for verifying probabilistic programs against oblivious
          adversaries.
        collaborators:
          - name: Noam Zilberstein
            note: now at Stevens
          - name: Andrew C. Myers
          - name: Alexandra Silva
        refs:
          - chen2026oblivious

      - id: type-confusion-security
        title: Type-Confusion Security
        image: image/type-confusion.png
        keywords: [Information flow, Type systems, Security]
        description: >
          In decentralized systems, untrusted components can ignore
          the type system and lie about the interfaces they provide.
          Type-confusion security is a [real–ideal
          emulation](https://arxiv.org/abs/2611.05695) definition
          stating that ill-typed attackers have no more power than
          well-typed ones. It captures confused-deputy and reentrancy
          attacks. In an information-flow-typed core calculus,
          run-time checks extend the type system's static protection
          to ill-typed attackers. We mechanized it in Lean 4 as an
          extensible, executable framework for modeling other attacks.
        collaborators:
          - name: Silei Ren
          - name: Suraaj Kanniwadi
          - name: Andrew C. Myers
        refs:
          - ren2026type

      - id: autoformalization
        title: Autoformalization
        image: image/mathai.png
        keywords: [Lean 4, AI for Mathematics]
        description: >
          Autoformalization asks AI systems to translate mathematical
          statements and proofs into Lean code. Cornell's ongoing
          Math+AI project develops challenging research-level
          benchmarks, a survey for comparing Lean proofs, a collection
          of formalization problems, and LaTeX-to-Lean proof tooling.
        collaborators:
          - name: Daniel Halpern-Leistner
            note: Cornell Mathematics
        links:
          - label: Math+AI
            url: https://danielhl.github.io/math-ai.html

