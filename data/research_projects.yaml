      - id: precedence-constraints
        title: Knapsack Problems with Precedence Constraints
        image: image/precedence.png
        keywords: [Algorithms]
        description: >
          Real-world knapsack problems, including cryptocurrency
          mining and inventory planning, often involve dependencies.
          However, precedence-constrained knapsack is strongly NP-hard
          in general. This project studies special graph classes where
          exact pseudo-polynomial algorithms are possible. Joint work
          with [Prof. Sanjeev
          Khanna](https://sanjeevkhanna.org/) (now at NYU).
        refs:
