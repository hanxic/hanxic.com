      - id: vellvm-differential-testing
        title: Differential Testing for LLVM
        prefix: Vellvm
        image: image/VellvmSlide-new.svg
        description: >
          LLVM IR is a widely used compiler intermediate representation whose
          official semantics are informal. Developed in [Prof. Steve Zdancewic](https://www.cis.upenn.edu/~stevez/)'s
          group, [Vellvm](https://vellvm.github.io/vellvm/) formalizes a practical subset of LLVM IR in Rocq,
          including a memory model for optimization reasoning and differential
          testing to validate the semantics and find LLVM bugs.
        refs:
          - beck2025a
